services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./data/sqlite:/app/data
    depends_on:
      - ollama
    networks:
      - reviewer-net
    restart: unless-stopped

  ollama:
    build:
      context: ./ollama
      dockerfile: Dockerfile
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
    - OLLAMA_NUM_CTX=16384
    networks:
      - reviewer-net
    restart: unless-stopped

  frontend-dash:
    build:
      context: ./frontend-dash
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - reviewer-net
    restart: unless-stopped

volumes:
  {}

networks:
  reviewer-net:
    driver: bridge